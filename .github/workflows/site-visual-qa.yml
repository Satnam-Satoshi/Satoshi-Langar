name: Site visual QA
on:
  pull_request:
    branches: [agent/wall-street-20261011]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Install pinned credential-free build and browser tools
        run: |
          npm install --global pnpm@11.19.0
          npm install --prefix "$RUNNER_TEMP/site-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/site-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/site-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm release:prepare
      - name: Require repeated builds to produce identical deployment bytes
        run: |
          node --input-type=module <<'NODE'
          import {builtOutputManifest} from './scripts/cloud-ltc-release.mjs';
          import {writeFile,rm} from 'node:fs/promises';
          await writeFile(process.env.RUNNER_TEMP+'/first-build-manifest.json',JSON.stringify(await builtOutputManifest('.vercel/output')));
          for(const generated of ['.next','out','dist','.vercel/output'])await rm(generated,{recursive:true,force:true});
          NODE
          pnpm build && pnpm release:prepare
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {builtOutputManifest} from './scripts/cloud-ltc-release.mjs';
          import {readFile} from 'node:fs/promises';
          assert.deepEqual(await builtOutputManifest('.vercel/output'),JSON.parse(await readFile(process.env.RUNNER_TEMP+'/first-build-manifest.json','utf8')));
          NODE
      - name: Render desktop and mobile route families and exercise menus
        env:
          QA_OUTPUT: ${{ runner.temp }}/site-visual-qa
        run: node scripts/qa-site-browser.mjs
      - name: Exercise isolated authentication browser flows
        run: node --test scripts/test-auth-browser.mjs
      - name: Save screenshot evidence for this exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-visual-qa-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/site-visual-qa/
          retention-days: 30
          if-no-files-found: error
