# INACTIVE LOCAL REVIEW ARTIFACT: not installed or dispatched. Reviewed source and manifest pinned below.
name: One private receipt bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ltc-production-publication
  cancel-in-progress: false
jobs:
  owner-approval:
    name: owner-approval
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: ltc-receipt-owner-approval
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Native owner gate completed
        run: 'true'
  create-private-receipt-once:
    name: create-private-receipt-once
    needs: owner-approval
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: ltc-production
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2a399850406e7aa8b5f5385411250cb56ea6de2e
          persist-credentials: false
      - name: Verify source and assemble private target without Google credentials
        env:
          SOURCE_SHA: 2a399850406e7aa8b5f5385411250cb56ea6de2e
          CLI_SHA256: 2d324fa36a2e51a80b85fd26ca55391cf890f725f8dfcc51126f7010806a759a
          SOURCE_MANIFEST_JSON: '{"scripts/cloud-ltc-receipt-provenance-cli.mjs":"2d324fa36a2e51a80b85fd26ca55391cf890f725f8dfcc51126f7010806a759a","scripts/cloud-ltc-receipt-provenance.mjs":"8c6a7d8bae43babbcd0bbff0e6bdb8895698de53eb14ee3fe461904a11423723","scripts/cloud-ltc-receipt-provenance-bootstrap.mjs":"2e41c09c6d77b2c59c89ebcf020e50493d3f88143af29937a89554124fd18ea5","scripts/cloud-ltc-receipt-provenance-transport.mjs":"949e9274532c9e0fd37942e1c89189e1a8079e38116e633aca9aeeb35beea477","scripts/cloud-ltc-receipt-native-authority.mjs":"1b880f0a0d0d5fa0f182816dd241a22d7872922e68b0f1830fec680ac1779a19","scripts/cloud-ltc-receipt-prior-inventory.mjs":"828d0f185ba4559b4e84e93fa64efeee90fc53a7e94c8c2ffbceae39180c167d","scripts/cloud-ltc-google-auth.mjs":"52bbf1d4e672a4071627f4f95846ba49da117dd5fa0e9901263c201d0e1d726e"}'
          SOURCE_MANIFEST_SHA256: 9a2f5400ef4851f10c5c8cbfc3f47c245351e58530acaf3ff5581eea0169984a
          INCIDENT_LABEL: 'November 14 publication recovery'
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          TARGET_FOLDER: ${{ vars.LTC_STATE_FOLDER_ID }}
          TARGET_OWNER: ${{ vars.LTC_EVIDENCE_OWNER_PERMISSION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$CLI_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$CLI_SHA256" scripts/cloud-ltc-receipt-provenance-cli.mjs | sha256sum --check --status
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import path from 'node:path';
          import {verifyBootstrapSource} from './scripts/cloud-ltc-receipt-provenance-cli.mjs';
          const e=process.env;
          const config={github:{runId:e.GITHUB_RUN_ID,sourceSha:e.SOURCE_SHA,executedSourceSha:e.SOURCE_SHA,workflowSha:e.WORKFLOW_SHA,workflowPath:'.github/workflows/receipt-bootstrap-once.yml',environmentId:27323462394},publisher:{folderId:e.TARGET_FOLDER,ownerPermissionId:e.TARGET_OWNER,incident:e.INCIDENT_LABEL,runId:e.GITHUB_RUN_ID,attempt:1,identitySource:'protected-publisher-credential'},sourceManifest:JSON.parse(e.SOURCE_MANIFEST_JSON),sourceManifestSha256:e.SOURCE_MANIFEST_SHA256};
          await verifyBootstrapSource({root:process.cwd(),config});
          await writeFile(path.join(e.RUNNER_TEMP,'ltc-receipt-bootstrap-private.json'),JSON.stringify(config),{flag:'wx',mode:0o600});
          NODE
      - name: Create private receipt once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LTC_GOOGLE_CLIENT_ID: ${{ secrets.LTC_GOOGLE_CLIENT_ID }}
          LTC_GOOGLE_CLIENT_SECRET: ${{ secrets.LTC_GOOGLE_CLIENT_SECRET }}
          LTC_GOOGLE_REFRESH_TOKEN: ${{ secrets.LTC_GOOGLE_REFRESH_TOKEN }}
        run: node scripts/cloud-ltc-receipt-provenance-cli.mjs
