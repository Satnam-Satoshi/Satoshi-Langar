name: Cloud newsroom v2 isolated research proof
# No schedule and no publishing job. This tests a NEW generation, not recovery.
on:
  push:
    branches: [agent/cloud-newsroom-v2-20261116, agent/desk-status-preparation-20261117]
    # All paths intentionally trigger, including tools/desk-status/** and tools/route-freshness/**.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltc-cloud-newsroom-v2-research
  cancel-in-progress: false
jobs:
  research-proof:
    if: github.repository == 'Satnam-Satoshi/Satoshi-Langar' && (github.ref == 'refs/heads/agent/cloud-newsroom-v2-20261116' || github.ref == 'refs/heads/agent/desk-status-preparation-20261117')
    runs-on: ubuntu-24.04
    env:
      LTC_MARKETING_PYTHON: /usr/bin/python3
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Install locked test dependencies without lifecycle scripts
        run: npm exec --yes --package=pnpm@11.19.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Install official distro renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends inkscape python3-pil fonts-dejavu-core
          inkscape --version
          /usr/bin/python3 -c 'import PIL; print("Pillow", PIL.__version__)'
      - name: Verify renderer input gates without publishing
        working-directory: tools/cloud-marketing
        run: /usr/bin/python3 -B -m unittest -v
      - name: Verify private HTML evidence parser without publishing
        run: /usr/bin/python3 -I -B -m unittest discover -s tools/cloud-newsroom-v2 -p 'test_*.py' -v
      - name: Verify source lineage and tests without production credentials
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor fd45e107ac37e537195b7311baeba8cd40b2f035 "$GITHUB_SHA"
          node --test scripts/test-cloud-newsroom-v2-*.mjs
      - name: Verify desk display and immutable route inventory without publishing
        run: npm run test:desk-status
      - name: Read public primary sources into isolated new evidence
        run: node scripts/cloud-newsroom-v2-scan.mjs --output "$RUNNER_TEMP/newsroom-v2-evidence"
      - name: Check research cannot modify tracked source or publish
        run: |
          test -z "$(git status --porcelain)"
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/newsroom-v2-evidence/coverage.json")); if(p.publication.performed!==false||p.mode!=="read-only-source-scan"||p.coverage.retrieved<1)throw Error("unexpected effect");'
      - name: Retain source-access proof, not a publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: newsroom-v2-source-access-${{ github.sha }}
          path: ${{ runner.temp }}/newsroom-v2-evidence/coverage.json
          retention-days: 30
          if-no-files-found: warn
