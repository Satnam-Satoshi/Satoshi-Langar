# Credential-free engineering validation. This job cannot publish or access private storage.
name: LTC cloud publisher review
on:
  pull_request:
    branches: [agent/wall-street-20261011]
    paths:
      - '.github/workflows/ltc-cloud-review.yml'
      - 'scripts/cloud-ltc-*.mjs'
      - 'scripts/test-cloud-ltc-*.mjs'
      - 'scripts/collect-litecoin-distribution.mjs'
      - 'scripts/prepare-ltc-source-desk.mjs'
      - 'scripts/lib/ltc-routine-data.mjs'
      - 'config/ltc-cloud-*.json'
      - 'ops/ltc-daily-workflow.yml'
permissions:
  contents: read
concurrency:
  group: ltc-cloud-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'Satnam-Satoshi/Satoshi-Langar' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Install pinned validation tools without service credentials
        run: npm install --global pnpm@11.19.0 vercel@61.1.0
      - name: Offline provider and recovery contracts
        run: pnpm cloud:check
      - name: Independent cloud collection and complete build
        shell: bash
        run: |
          set -euo pipefail
          # This computed digest identifies validation bytes; it cannot approve publication.
          validation_digest="$(node scripts/ltc-release-guard.mjs)"
          node scripts/cloud-ltc-release.mjs --dry-run --expected-digest "$validation_digest" --receipt "$RUNNER_TEMP/ltc-cloud-review.json"
      - name: Sanitized result
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync,appendFileSync} from 'node:fs';
          const path=process.env.RUNNER_TEMP+'/ltc-cloud-review.json';
          if(!existsSync(path))process.exit(0);
          const r=JSON.parse(readFileSync(path,'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'```json\n'+JSON.stringify({source:r.source,status:r.status,mode:r.mode,published:r.published,edition:r.edition,failure:r.failure},null,2)+'\n```\n');
          NODE
