# Credential-free engineering validation. This job cannot publish or access private storage.
name: LTC cloud publisher review
on:
  pull_request:
    branches: [agent/wall-street-20261011]
    paths:
      - '.github/workflows/ltc-cloud-review.yml'
      - 'scripts/cloud-ltc-*.mjs'
      - 'scripts/test-cloud-ltc-*.mjs'
      - 'scripts/collect-litecoin-distribution.mjs'
      - 'scripts/prepare-ltc-source-desk.mjs'
      - 'scripts/lib/ltc-routine-data.mjs'
      - 'config/ltc-cloud-*.json'
      - 'ops/ltc-daily-workflow.yml'
permissions:
  contents: read
concurrency:
  group: ltc-cloud-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'Satnam-Satoshi/Satoshi-Langar' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Install pinned validation tools without service credentials
        run: npm install --global pnpm@11.19.0 vercel@65.9.0
      - name: Install locked application dependencies without credentials
        run: pnpm install --frozen-lockfile
      - name: Offline provider and recovery contracts
        run: pnpm cloud:check
      - name: Build exact committed acceptance artifact without provider credentials
        run: |
          pnpm check
          pnpm release:prepare
      - name: Offline stage recipe plan using explicit fixture resources only
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync,readFileSync} from 'node:fs';import {execFileSync} from 'node:child_process';import {builtManifest} from './scripts/cloud-ltc-release.mjs';import {publicEditions} from './scripts/lib/ltc-public-editions.mjs';
          const d=process.env.RUNNER_TEMP+'/ltc-offline-acceptance';mkdirSync(d,{mode:0o700});mkdirSync(d+'/evidence',{mode:0o700});
          const save=(name,value)=>writeFileSync(d+'/'+name,JSON.stringify(value)+'\n',{flag:'wx',mode:0o600});
          save('website.json',{schemaVersion:1,provider:'google-docs',publicationEnabled:false,folderId:'offline_folder_fixture',documentId:'offline_website_fixture'});
          save('social.json',{schemaVersion:1,provider:'google-docs',publicationEnabled:false,folderId:'offline_folder_fixture',documentId:'offline_social_fixture',ledgerKey:'social'});
          save('evidence.json',{folderId:'offline_folder_fixture',ownerPermissionId:'offline_owner_fixture'});
          save('previous.json',await builtManifest(process.cwd()+'/dist'));save('evidence/build.json',{mode:'offline-fixture-plan-only'});
          const edition=publicEditions(JSON.parse(readFileSync('content/ltc/index.json','utf8')),JSON.parse(readFileSync('config/ltc-publication-exclusions.json','utf8'))).sort((a,b)=>b.date.localeCompare(a.date)||b.revision-a.revision)[0].id;
          const digest=execFileSync(process.execPath,['scripts/ltc-release-guard.mjs'],{encoding:'utf8'}).trim();
          execFileSync(process.execPath,['scripts/cloud-ltc-acceptance.mjs','--mode','plan','--root',process.cwd(),'--evidence-dir',d+'/evidence','--state-config',d+'/website.json','--social-state-config',d+'/social.json','--evidence-config',d+'/evidence.json','--edition-id',edition,'--acceptance-id','offline-recipe','--previous-deployment','dpl_OfflineFixture','--previous-manifest',d+'/previous.json','--receipt',d+'/plan.json'],{stdio:'inherit',env:{...process.env,LTC_ACCEPTED_IMPLEMENTATION_SHA256:digest}});
          NODE
      - name: Independent cloud collection and complete build
        shell: bash
        run: |
          set -euo pipefail
          # This computed digest identifies validation bytes; it cannot approve publication.
          validation_digest="$(node scripts/ltc-release-guard.mjs)"
          node scripts/cloud-ltc-release.mjs --dry-run --expected-digest "$validation_digest" --receipt "$RUNNER_TEMP/ltc-cloud-review.json"
      - name: Sanitized result
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync,appendFileSync} from 'node:fs';
          const path=process.env.RUNNER_TEMP+'/ltc-cloud-review.json';
          if(!existsSync(path))process.exit(0);
          const r=JSON.parse(readFileSync(path,'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'```json\n'+JSON.stringify({source:r.source,status:r.status,mode:r.mode,published:r.published,edition:r.edition,failure:r.failure},null,2)+'\n```\n');
          NODE
