name: Build verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch fixed accepted source for diagnostic parser tests
        run: |
          git fetch --no-tags --depth=1 origin b413419180635b34a88b3015944cfaee7a08f742
          git fetch --no-tags --depth=1 origin 9fc3d385fbe461bc169cda9eb521f4a14859b7d0

      - name: Verify finite social dispatcher boundaries
        run: node --test tests/social-dispatch.test.mjs tests/stage-metadata-diagnostic.test.mjs tests/stage-protected-diagnostic.test.mjs tests/failed-file-diagnostic.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
