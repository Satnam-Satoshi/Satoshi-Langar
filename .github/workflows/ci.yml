name: Build verification
on:
  pull_request:
  push:
    branches: [main, agent/satnam-soft-launch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable historical preview guard fixture
        run: git fetch --no-tags --depth=1 origin 52d2e5a08e4fbec181e43a8aa625c0fa01cc992a
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pinned CLI for its offline argument-parser contract
        run: npm install --global vercel@65.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: satnam-satoshi-static-site
          path: dist/
