name: Standalone newsroom dormant source tests
# Source-only synthetic checks. No schedule, credentials, provisioning or deploy.
on:
  push:
    branches: [agent/standalone-newsroom-20261117]
permissions:
  contents: read
jobs:
  source-tests:
    if: github.repository == 'Satnam-Satoshi/Satoshi-Langar' && github.ref == 'refs/heads/agent/standalone-newsroom-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Test dormant core and direct adapter contracts without live APIs
        working-directory: tools/standalone-runtime
        run: |
          node --test test/*.mjs
          test "$(node src/main.mjs)" = '{"status":"deployment-disabled","reason":"Reviewed adapters, owner configuration and independent state initialization required","effects":[]}'
      - name: Verify no tracked file was changed
        run: test -z "$(git status --porcelain)"
