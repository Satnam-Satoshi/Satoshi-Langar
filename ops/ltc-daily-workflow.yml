    if: github.repository == 'Satnam-Satoshi/Satoshi-Langar' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.acceptance_probe && (inputs.acceptance_mode == '' || inputs.acceptance_mode == 'none')
