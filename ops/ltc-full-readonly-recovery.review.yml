# LOCAL NON-RUNNABLE REVIEW TEMPLATE. Fill reviewed source, module SHA and manifest only after commit.
name: One full read-only recovery inspection
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ltc-production-publication
  cancel-in-progress: false
jobs:
  owner-approval:
    name: owner-approval
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: ltc-receipt-owner-approval
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Native owner gate completed
        run: 'true'
  inspect-private-recovery-once:
    name: inspect-private-recovery-once
    needs: owner-approval
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: ltc-production
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: REVIEWED_SOURCE_SHA_REQUIRED
          persist-credentials: false
      - name: Verify source and assemble private target without Google credentials
        env:
          SOURCE_SHA: REVIEWED_SOURCE_SHA_REQUIRED
          CLI_SHA256: REVIEWED_CLI_SHA256_REQUIRED
          SOURCE_MANIFEST_JSON: REVIEWED_FULL_DEPENDENCY_MANIFEST_REQUIRED
          SOURCE_MANIFEST_SHA256: REVIEWED_MANIFEST_SHA256_REQUIRED
          INCIDENT_LABEL: REVIEWED_INCIDENT_REQUIRED
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          TARGET_FOLDER: ${{ secrets.LTC_STATE_FOLDER_ID }}
          TARGET_OWNER: ${{ secrets.LTC_EVIDENCE_OWNER_PERMISSION_ID }}
          STATE_DOCUMENT: ${{ secrets.LTC_STATE_DOCUMENT_ID }}
          RECEIPT_ORIGIN_RUN: REVIEWED_SUCCESSFUL_RECEIPT_RUN_REQUIRED
          FAILED_PUBLICATION_RUN: REVIEWED_FAILED_PUBLICATION_RUN_REQUIRED
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_FOLDER" && test -n "$TARGET_OWNER" && test -n "$STATE_DOCUMENT"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$CLI_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$CLI_SHA256" scripts/cloud-ltc-f33-full-readonly-cli.mjs | sha256sum --check --status
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import path from 'node:path';
          import {verifyInspectionSource} from './scripts/cloud-ltc-f33-full-readonly-cli.mjs';
          const e=process.env;
          const config={github:{runId:e.GITHUB_RUN_ID,sourceSha:e.SOURCE_SHA,executedSourceSha:e.SOURCE_SHA,workflowSha:e.WORKFLOW_SHA,workflowPath:'.github/workflows/ltc-readonly-recovery.yml',environmentId:27323462394},lookup:{folderId:e.TARGET_FOLDER,ownerPermissionId:e.TARGET_OWNER,incident:e.INCIDENT_LABEL,runId:e.RECEIPT_ORIGIN_RUN,attempt:1,identitySource:'protected-publisher-credential'},state:{schemaVersion:1,provider:'google-docs',publicationEnabled:false,ledgerKey:'website',folderId:e.TARGET_FOLDER,documentId:e.STATE_DOCUMENT},incident:{folderId:e.TARGET_FOLDER,ownerPermissionId:e.TARGET_OWNER,originRunId:e.FAILED_PUBLICATION_RUN,originAttempt:1},sourceManifest:JSON.parse(e.SOURCE_MANIFEST_JSON),sourceManifestSha256:e.SOURCE_MANIFEST_SHA256};
          await verifyInspectionSource({root:process.cwd(),config});
          await writeFile(path.join(e.RUNNER_TEMP,'ltc-full-readonly-recovery-private.json'),JSON.stringify(config),{flag:'wx',mode:0o600});
          NODE
      - name: Inspect private recovery once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LTC_GOOGLE_CLIENT_ID: ${{ secrets.LTC_GOOGLE_CLIENT_ID }}
          LTC_GOOGLE_CLIENT_SECRET: ${{ secrets.LTC_GOOGLE_CLIENT_SECRET }}
          LTC_GOOGLE_REFRESH_TOKEN: ${{ secrets.LTC_GOOGLE_REFRESH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/cloud-ltc-f33-full-readonly-cli.mjs
